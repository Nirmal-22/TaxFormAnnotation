[project]
name = "tfa"
version = "1.0.0"
description = "Tax Form Annotation: a spec and reference renderer for printing data onto tax form PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "pypdf>=4.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdfium2>=4", "pillow>=10"]

[project.scripts]
tfa = "tfa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"schema/tfa.schema.json" = "tfa/tfa.schema.json"
